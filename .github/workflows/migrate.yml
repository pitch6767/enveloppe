name: Migrations D1

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Appliquer les migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler@latest d1 migrations apply enveloppe --remote 2>&1 | tee sortie.txt
          code=${PIPESTATUS[0]}
          {
            echo '```'
            tail -60 sortie.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
