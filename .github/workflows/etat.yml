name: Etat de la base

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Interroger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          Q=$(cat etat.sql | tr '\n' ' ')
          npx wrangler@latest d1 execute enveloppe --remote --json --command "$Q" > ETAT.json 2>&1 || true
          head -c 40000 ETAT.json > ETAT.txt
      - name: Publier
        run: |
          git config user.name "etat-bot"
          git config user.email "etat@local"
          git add ETAT.txt
          git commit -m "etat" || exit 0
          git push
