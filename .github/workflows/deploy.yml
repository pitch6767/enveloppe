name: Deployer le Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deployer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest deploy 2>&1 | tee sortie.txt
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' sortie.txt | head -1 > URL.txt
          cat URL.txt

      - name: Publier l'URL
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy@local"
          git add URL.txt
          git commit -m "URL deployee" || exit 0
          git push
