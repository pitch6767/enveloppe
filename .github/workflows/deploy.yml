name: Deployer le Worker

on:
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deployer avec le sous-domaine workers.dev
        run: |
          npx wrangler@latest deploy 2>&1 | tee sortie.txt
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' sortie.txt | head -1)
          echo "URL_DEPLOYEE=$URL"
          gh api "repos/$GITHUB_REPOSITORY/issues" -f title="URL: $URL" -f body="deploiement" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
