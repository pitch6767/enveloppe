name: Poser les secrets du Worker

on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ADMIN_CODE
        if: ${{ secrets.ADMIN_CODE != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' '${{ secrets.ADMIN_CODE }}' | npx wrangler@latest secret put ADMIN_CODE

      - name: ANTHROPIC_API_KEY
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' '${{ secrets.ANTHROPIC_API_KEY }}' | npx wrangler@latest secret put ANTHROPIC_API_KEY
