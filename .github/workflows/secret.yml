name: Poser les secrets du Worker

on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poser les secrets presents
        run: |
          if [ -n "$ADMIN_CODE" ]; then
            printf '%s' "$ADMIN_CODE" | npx wrangler@latest secret put ADMIN_CODE
            echo "ADMIN_CODE pose"
          else
            echo "ADMIN_CODE absent, ignore"
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler@latest secret put ANTHROPIC_API_KEY
            echo "ANTHROPIC_API_KEY pose"
          else
            echo "ANTHROPIC_API_KEY absent, ignore"
          fi
